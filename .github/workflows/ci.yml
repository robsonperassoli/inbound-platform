name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # fallow audit compares the PR to its base commit.
          fetch-depth: 0

      # Node from mise.toml; pnpm from packageManager (pnpm@11.5.2).
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: mise.toml
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check migration drift
        run: pnpm db:check

      - name: Test
        run: pnpm test

      - name: API coverage summary
        if: always()
        run: node scripts/write-api-coverage-summary.mjs

      - name: Build
        run: pnpm build

      - name: Fallow audit
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha }}
          FALLOW_FORMAT: github-summary
        run: pnpm fallow:audit | tee -a "$GITHUB_STEP_SUMMARY"
